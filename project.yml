name: Periplus
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
  AppsFlyerLib:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework-Static
    from: 6.17.9
options:
  bundleIdPrefix: com.periplus
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Periplus:
    type: application
    platform: iOS
    sources:
    - path: Periplus
    resources:
    - path: PrivacyInfo.xcprivacy
    dependencies:
    - package: Alamofire
    - package: AppsFlyerLib
      product: AppsFlyerLib-Static
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.periplus.route
        PRODUCT_NAME: Periplus
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_CFBundleDisplayName: Reelora
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_NSCameraUsageDescription: Periplus uses the camera to read the ISBN barcode printed on a book so that volume can be added to the catalogue on this device.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Support/Periplus-Info.plist
  PeriplusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: PeriplusTests
    dependencies:
    - target: Periplus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.periplus.route.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_VERSION: '6.2'
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Periplus.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Periplus
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
schemes:
  Periplus:
    build:
      targets:
        Periplus: all
        PeriplusTests:
        - test
    test:
      targets:
      - PeriplusTests
